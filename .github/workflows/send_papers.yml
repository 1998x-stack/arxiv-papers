name: arXiv Papers Digest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 08:00 UTC, matching the README; replaces legacy 20-minute mail loop.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview digest without sending email"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: arxiv-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install maintained digest package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run offline digest tests
        run: |
          python -m pytest -q \
            tests/test_cli.py tests/test_config.py tests/test_emailer.py \
            tests/test_formatter.py tests/test_models.py tests/test_wordcloud.py \
            tests/test_paper_parsing.py

      - name: Preview digest (manual dry run only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: arxiv-digest --dry-run

      - name: Validate email delivery secrets
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$EMAIL_USERNAME" || -z "$EMAIL_PASSWORD" ]]; then
            echo "::error::Configure EMAIL_USERNAME and EMAIL_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Send digest
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: arxiv-digest
